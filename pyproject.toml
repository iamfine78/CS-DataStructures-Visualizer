description = "手写实现经典数据结构与算法，配合 matplotlib 可视化，用于 408 数据结构复习"
requires-python = ">=3.10"
dependencies = [
    "matplotlib>=3.7.0",
]

[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

[project.optional-dependencies]
test = [
    "pytest>=7.4.0",
]
